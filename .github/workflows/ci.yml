name: Just Releases validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test validators
        run: node --test tests/*.test.mjs

      - name: Test PowerShell installer security
        shell: pwsh
        run: ./tests/install-security.tests.ps1

      - name: Validate manifests
        run: node scripts/validate-manifests.mjs

      - name: Validate repository safety
        run: node scripts/check-repository-safety.mjs
