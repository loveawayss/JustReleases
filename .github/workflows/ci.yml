name: Just Releases validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate JSON and URLs
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const info = JSON.parse(fs.readFileSync("update_info.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(info.version)) throw new Error("Invalid version");
          if (!Array.isArray(info.notes)) throw new Error("notes must be an array");
          if (!info.downloadUrl.startsWith("https://github.com/loveawayss/JustReleases/releases/")) throw new Error("Invalid JustHub URL");
          if (!/^[a-f0-9]{64}$/i.test(info.sha256)) throw new Error("Invalid sha256");
          const catalog = JSON.parse(fs.readFileSync("catalog.json", "utf8"));
          if (catalog.schemaVersion !== 1 || !Array.isArray(catalog.products)) throw new Error("Invalid catalog");
          for (const product of catalog.products) {
            if (!product.id || !fs.existsSync(product.manifest)) throw new Error(`Invalid product entry: ${product.id}`);
            const manifest = JSON.parse(fs.readFileSync(product.manifest, "utf8"));
            if (manifest.id !== product.id || !/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error(`Invalid manifest: ${product.manifest}`);
            if (!Array.isArray(manifest.artifacts) || manifest.artifacts.length === 0) throw new Error(`No artifacts: ${product.manifest}`);
            for (const artifact of manifest.artifacts) {
              if (!artifact.downloadUrl.startsWith("https://github.com/loveawayss/JustReleases/releases/")) throw new Error(`Invalid artifact URL: ${artifact.fileName}`);
              if (!/^[a-f0-9]{64}$/i.test(artifact.sha256)) throw new Error(`Invalid artifact hash: ${artifact.fileName}`);
            }
          }
          console.log(`Catalog is valid: ${catalog.products.length} product(s)`);
          NODE
      - name: Validate JustPrivate signed update metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("products/justprivate-update-manifest.json", "utf8"));
          const signature = JSON.parse(fs.readFileSync("products/justprivate-update-manifest.json.sig", "utf8"));
          if (manifest.product !== "JustPrivate" || manifest.channel !== "stable") throw new Error("Invalid JustPrivate identity");
          if (!/^\d+\.\d+\.\d+$/.test(manifest.latestVersion)) throw new Error("Invalid JustPrivate version");
          if (!/^\d+\.\d+\.\d+$/.test(manifest.minimumSupportedVersion)) throw new Error("Invalid minimum version");
          if (manifest.mandatory !== true) throw new Error("JustPrivate mandatory update policy is required");
          if (!/^JustPrivate-update-\d+\.\d+\.\d+-full\.zip$/.test(manifest.assetName)) throw new Error("Invalid update asset name");
          const expectedRelease = `justprivate-v${manifest.latestVersion}`;
          if (!manifest.downloadUrl.startsWith(`https://github.com/loveawayss/JustReleases/releases/download/${expectedRelease}/`)) throw new Error("Update URL does not bind to the declared release");
          if (!manifest.releaseNotesUrl.endsWith(`/releases/tag/${expectedRelease}`)) throw new Error("Release notes URL does not bind to the declared release");
          if (!/^[a-f0-9]{64}$/i.test(manifest.sha256)) throw new Error("Invalid JustPrivate update hash");
          if (signature.signatureAlgorithm !== "ECDSA_P256_SHA256") throw new Error("Unsupported JustPrivate signature algorithm");
          if (!/^[a-z0-9][a-z0-9._-]{2,127}$/i.test(signature.signatureKeyId)) throw new Error("Invalid JustPrivate signature key id");
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(signature.signature)) throw new Error("Invalid JustPrivate signature encoding");
          if (!/^[a-f0-9]{64}$/i.test(signature.canonicalSha256)) throw new Error("Invalid signed canonical hash");
          NODE
      - name: Reject secrets and private source references
        shell: bash
        run: |
          ! git grep -n -E -i '(sb_secret_|service_role|supabase.{0,40}(secret|service)|-----begin.{0,30}private key|ghp_[a-z0-9_]+|github_pat_[a-z0-9_]+|akia[0-9a-z]{16}|loveawayss/JustPrivate)' -- ':!SECURITY.md' ':!AGENTS.md' ':!CONTRIBUTING.md' ':!.github/workflows/ci.yml'
      - name: Validate legacy installer hash
        shell: bash
        run: |
          test "$(sha256sum releases/justhub-setup.exe | cut -d ' ' -f 1)" = "$(node -p 'JSON.parse(require("fs").readFileSync("update_info.json")).sha256')"
